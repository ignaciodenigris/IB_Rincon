{% load static %}
{% include "website/navbar.html" %}

<link rel="stylesheet" href="{% static 'herramientas/css/crear_proyecto.css' %}">

<div class="crear-proyecto-container">
    <h2>Crear un nuevo proyecto</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Guardar proyecto</button>
    </form>

    <a href="{% url 'lista_proyectos' %}" class="volver-link">
        ← Volver a la lista
    </a>
</div>
